# Builds the Windows app and its installer on a Windows computer at GitHub,
# checks that the installed app really starts, and offers the installer for
# download. See INSTALL.md.
#
#   Every push:              runs the tests, builds TradingApp-Setup-<version>.exe and
#                            attaches it to the run (Actions tab > the run > Artifacts).
#   A tag like v0.4.0:       also publishes it on the repository's Releases page.

name: Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # only used to publish a release for a v* tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Install MetaTrader 5 support (optional)
        continue-on-error: true
        run: python -m pip install -r requirements-mt5.txt

      - name: Run the tests
        run: python -m pytest -q

      - name: Build TradingApp.exe
        run: |
          $version = python packaging/make_version_info.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          python -m PyInstaller --noconfirm --clean packaging/trading_app.spec

      - name: Check the built app starts and runs scripts
        run: python packaging/smoke_test.py dist/TradingApp/TradingApp.exe

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install it, check the installed app, uninstall it
        run: |
          $setup = "dist/TradingApp-Setup-$env:APP_VERSION.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $exe = "$env:LOCALAPPDATA\Programs\TradingApp\TradingApp.exe"
          if (-not (Test-Path $exe)) { throw "The installer did not put TradingApp.exe in $exe" }
          python packaging/smoke_test.py $exe
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Programs\TradingApp\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          if (Test-Path $exe) { throw "The uninstaller left TradingApp.exe behind" }

      - name: Offer the installer for download
        uses: actions/upload-artifact@v4
        with:
          name: TradingApp-Setup-${{ env.APP_VERSION }}
          path: dist/TradingApp-Setup-*.exe
          if-no-files-found: error

      - name: Publish a release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TradingApp-Setup-*.exe
          generate_release_notes: true
